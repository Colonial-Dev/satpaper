[package]
name = "spacepaper"
authors = ["Colonial"]
version = "0.6.1"
edition = "2021"

description = "Display near-real-time satellite imagery on your desktop."
repository = "https://github.com/Colonial-Dev/satpaper"
readme = "README.md"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
# Runtime
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }

# Compositing
image = { version = "0.25", features = ["jpeg", "gif", "png", "pnm", "qoi", "tga", "tiff", "webp", "bmp", "dds"], default-features = false }
fimg = "0.4"
png = "0.18"

# Scraping
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = "0.4"